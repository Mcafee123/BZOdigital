services:
  dev:
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      - DOCKER=true
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3232:3232"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  node_modules:
