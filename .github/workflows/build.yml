name: Build

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'data/**'
      - 'src/nupla/app/data/**'
      - '.plans/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'src/nupla/app/data/**'
      - '.plans/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    name: Build image and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image (Vue SPA + FastAPI)
        run: docker build -t nupla-app:ci-${{ github.sha }} -f src/nupla/app/Dockerfile .

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init (no backend)
        working-directory: tf/prod/app
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: tf/prod/app
        env:
          TF_VAR_image_name: validate-only
        run: terraform validate
