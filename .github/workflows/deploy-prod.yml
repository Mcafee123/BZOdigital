name: Deploy PROD

on:
  push:
    branches: [main]
    paths:
      - 'src/nupla/app/**'
      - 'tf/**'
      - 'data/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: nupla-app
  ACR_NAME: anplatformacr
  ACR_LOGIN_SERVER: anplatformacr.azurecr.io

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app:  ${{ steps.filter.outputs.app }}
      tf:   ${{ steps.filter.outputs.tf }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/nupla/app/**'
            tf:
              - 'tf/**'
            data:
              - 'data/**'

  deploy:
    name: Build, push, and apply
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tf == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve ACR credentials and image version
        id: compose
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${VERSION}-${SHORT_SHA}"
          PW=$(az acr credential show -n "${ACR_NAME}" --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$PW"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "image-ref=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}"
            echo "acr-username=${ACR_NAME}"
            echo "acr-password=${PW}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: affolterNET/affolterNET.Github.SharedWorkflows/actions/build-backend@main
        with:
          project-root:   .
          project-folder: .
          project-file:   pyproject.toml
          version:        ${{ steps.compose.outputs.tag }}
          image-name:     ${{ env.IMAGE_NAME }}
          registry-name:  ${{ env.ACR_LOGIN_SERVER }}
          dockerfile:     src/nupla/app/Dockerfile
          push:           'true'
          acr-username:   ${{ steps.compose.outputs.acr-username }}
          acr-password:   ${{ steps.compose.outputs.acr-password }}

      - name: Tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.compose.outputs.tag }}"
          git push origin "v${{ steps.compose.outputs.tag }}"

      - name: Terraform init
        working-directory: tf/prod/app
        run: terraform init -input=false -backend-config=_backend.hcl

      - name: Terraform plan
        working-directory: tf/prod/app
        run: |
          terraform plan -input=false -out=tfplan \
            -var "image_name=${{ steps.compose.outputs.image-ref }}"

      - name: Terraform apply
        working-directory: tf/prod/app
        run: terraform apply -input=false -auto-approve tfplan

  sync-data:
    name: Sync data/ to Azure File share
    needs: changes
    if: needs.changes.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@v4
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read storage outputs from Terraform state
        id: tf
        working-directory: tf/prod/app
        run: |
          terraform init -input=false -backend-config=_backend.hcl
          {
            echo "sa=$(terraform output -raw storage_account_name)"
            echo "share=$(terraform output -raw file_share_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Install azcopy
        run: |
          curl -sSL https://aka.ms/downloadazcopy-v10-linux | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/azcopy'
          azcopy --version

      - name: Sync data/
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          azcopy sync "./data" \
            "https://${{ steps.tf.outputs.sa }}.file.core.windows.net/${{ steps.tf.outputs.share }}/data" \
            --delete-destination=true \
            --recursive
