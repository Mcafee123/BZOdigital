name: Deploy PROD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/data/**'
      - 'tf/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: bzo-app
  ACR_NAME: anplatformacr
  ACR_LOGIN_SERVER: anplatformacr.azurecr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image-ref: ${{ steps.version.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: version
        run: |
          VERSION=$(grep -m1 '^version' app/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_REF="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${VERSION}-${SHORT_SHA}"
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId":     "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId":     "${{ secrets.ARM_TENANT_ID }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}"
            }

      - name: ACR login
        run: az acr login --name "${ACR_NAME}"

      - name: Build image
        run: docker build -t "${{ steps.version.outputs.image-ref }}" app/

      - name: Push image
        run: docker push "${{ steps.version.outputs.image-ref }}"

      - name: Tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(echo "${{ steps.version.outputs.image-ref }}" | sed 's|.*:||')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${TAG}"
          git push origin "v${TAG}"

  deploy:
    name: Terraform apply
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tf/prod/app
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false -backend-config=_backend.hcl

      - name: Terraform plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var "image_name=${{ needs.build-and-push.outputs.image-ref }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
