name: Upload data files

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'app/data/**'
      - '.github/workflows/upload-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Sync data/ and app/data/ to Azure File share
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Read storage outputs from Terraform state
        id: tf
        working-directory: tf/prod/app
        run: |
          terraform init -input=false -backend-config=_backend.hcl
          {
            echo "sa=$(terraform output -raw storage_account_name)"
            echo "share=$(terraform output -raw file_share_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Install azcopy
        run: |
          curl -sSL https://aka.ms/downloadazcopy-v10-linux | \
            sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/azcopy'
          azcopy --version

      - name: Sync top-level data/
        if: hashFiles('data/**') != ''
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          azcopy sync "./data" \
            "https://${{ steps.tf.outputs.sa }}.file.core.windows.net/${{ steps.tf.outputs.share }}/data" \
            --delete-destination=true \
            --recursive

      - name: Sync app/data/
        if: hashFiles('app/data/**') != ''
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          azcopy sync "./app/data" \
            "https://${{ steps.tf.outputs.sa }}.file.core.windows.net/${{ steps.tf.outputs.share }}/app/data" \
            --delete-destination=true \
            --recursive
