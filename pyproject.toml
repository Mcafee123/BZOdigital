[project]
name = "bzodigital"
version = "0.1.0"
description = "Swiss municipal zoning document finder"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "thefuzz[speedup]>=0.22",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "xlrd>=2.0",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "beautifulsoup4>=4.12",
]

[project.scripts]
bzo = "bzodigital.cli:main"
bzo-api = "bzodigital.api:start"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "xlrd>=2.0.2",
]
