[project]
name = "bzodigital"
version = "0.1.0"
description = "Swiss municipal zoning document finder"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "thefuzz[speedup]>=0.22",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
]

[project.scripts]
bzo = "bzodigital.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
